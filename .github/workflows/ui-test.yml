name: UI Test

on:
  workflow_dispatch:
    inputs:
      python-version:
        type: string
        description: "Python interpreter version"
  workflow_call:
    inputs:
      python-version:
        type: string

jobs:
  ui-tests:
    name: UI Tests py${{ inputs.python-version }}
    # Playwright tests only work on Linux because they use a custom container.
    runs-on: ubuntu-24.04
    # Use the official Playwright image to avoid the dependency installation stalling
    # on Ubuntu, see https://github.com/microsoft/playwright/issues/34297
    container:
      # Keep the tag in sync with the playwright version resolved in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Check Playwright Browsers
        # Prebaked in the image; this just verifies the matching binary is present:
        run: npx playwright install
      - name: Compute pixi environment
        id: pixi-env
        shell: bash
        # Turn, e.g., '3.14' into 'test-py314'
        run: |
          PYVER="${{ inputs.python-version }}"
          echo "name=test-py${PYVER//./}" >> "$GITHUB_OUTPUT"
      - name: Install pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # 0.11.2
        with:
          pixi-version: "v0.82.1"
          environments: ${{ steps.pixi-env.outputs.name }}

      - name: Run Playwright tests
        run: pixi run test-js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
