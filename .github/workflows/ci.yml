name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v6
      - name: Install Javascript dependencies
        run: npm install
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: dev
          frozen: true
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        name: Run prek

  type-checking:
    name: Type checking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v6
      - name: Install Javascript dependencies
        run: npm install
      - name: Typecheck TypeScript
        run: npm run typecheck

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: dev
          frozen: true
      - name: Typecheck Python
        run: pixi run mypy

  base-tests:
    name: Tests
    strategy:
      matrix:
        include:
          - { python: "3.15", os: ubuntu-24.04 }
          - { python: "3.11", os: ubuntu-24.04 }
          - { python: "3.11", os: macos-14 }
          - { python: "3.11", os: windows-2025 }
    uses: ./.github/workflows/base-test.yml
    with:
      os-variant: ${{ matrix.os }}
      python-version: ${{ matrix.python }}

  ui-tests:
    name: Tests
    strategy:
      matrix:
        include:
          - { python: "3.11" }
    uses: ./.github/workflows/ui-test.yml
    with:
      python-version: ${{ matrix.python }}

  build:
    name: Build
    strategy:
      matrix:
        include:
          - { python: "3.11" }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v6
      - name: Install Javascript dependencies
        run: npm install
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: build
          frozen: true
      - name: Build package
        run: pixi run build
