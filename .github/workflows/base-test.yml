name: Basic Test

on:
  workflow_dispatch:
    inputs:
      os-variant:
        default: "ubuntu-24.04"
        type: string
        description: "Operating system"
      python-version:
        type: string
        description: "Python interpreter version"
  workflow_call:
    inputs:
      os-variant:
        default: "ubuntu-24.04"
        type: string
      python-version:
        type: string

jobs:
  base-tests:
    name: Basic Tests ${{ inputs.os-variant }} py${{ inputs.python-version }}
    runs-on: ${{ inputs.os-variant }}
    defaults:
      run:
        shell: bash -l {0} # required for conda env
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # 10.3.2
        with:
          python-version: "${{ inputs.python-version }}"

      - name: Compute pixi environment
        id: pixi-env
        shell: bash
        # Turn, e.g., '3.14' into 'test-py314'
        run: |
          PYVER="${{ inputs.python-version }}"
          echo "name=test-py${PYVER//./}" >> "$GITHUB_OUTPUT"
      - name: Install pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # 0.11.2
        with:
          pixi-version: "v0.82.1"
          environments: ${{ steps.pixi-env.outputs.name }}
      - name: Install mamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # 3.2.1
        with:
          micromamba-version: "2.9.0-0"

      # setup-micromamba does not install a 'mamba' binary, only 'micromamba'
      - name: Set micromamba path
        run: echo "SCITACEAN_MAMBA_EXECUTABLE=$(which micromamba)" >> "$GITHUB_ENV"

      - name: Run Tests
        run: pixi run test-py --env-tests
