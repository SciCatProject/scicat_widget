name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheel:
    name: Wheel
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history required build tool can determine version

      - name: Install Node
        uses: actions/setup-node@v6
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: build
          frozen: true
      - name: Build wheel
        run: pixi run build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  upload_packages:
    name: Deploy packages
    needs: [build_wheel]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/p/scicat_widget
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@v4
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
